name: Auto-Review
run-name: "Automated code review for \"${{ github.ref }}\""

on:
  push:
    branches:
      - main
  pull_request: # All pull requests

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

env:
  # Which version of the reports Sonar receives.
  DEFAULT_OS: ubuntu
  DEFAULT_PYTHON: "3.14"

jobs:
  test:
    name: Validate python code (${{ matrix.os }}/py${{ matrix.version }})
    runs-on: ${{ matrix.os }}-latest

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu"]
        version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install bastet
        shell: bash
        run: pip install '.[dev]'

      - name: Run bastet against bastet
        if: always()
        shell: bash
        run: bastet --skip format --reporter github sonar

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-${{ matrix.os }}-${{ matrix.version }}
          path: reports

  tests-passed:
    name: Tests Passed
    runs-on: ubuntu-latest

    needs:
      - test

    steps:
      - name: Mark all test runs as successful
        run: /bin/true

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest

    if: always()

    needs:
      - test

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v7
        if: always()
        with:
          name: review-${{ env.DEFAULT_OS }}-${{ env.DEFAULT_PYTHON }}
          path: reports

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}